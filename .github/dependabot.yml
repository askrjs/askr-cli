version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    groups:
      askr-packages:
        patterns:
          - "@askrjs/*"
      other-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@askrjs/*"
        update-types:
          - minor
          - patch
