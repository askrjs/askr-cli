name: CI

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit (Node LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Setup qualified npm
        shell: bash
        run: |
          npm install --global npm@12.0.1
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "12.0.1"
      - name: Install dependencies
        run: npm ci
      - name: Audit production and development dependencies
        run: npm audit

  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["24.21.0"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Setup qualified npm
        shell: bash
        run: |
          npm install --global npm@12.0.1
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "12.0.1"
      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        if: ${{ hashFiles('vitest.test.browser.config.ts', 'playwright.config.*') != '' }}
        run: npx playwright install chromium

      - name: Format check
        run: npm run fmt --if-present -- --check

      - name: Full release checks
        run: npm run check

      - name: Installed typed-client cancellation contract
        run: npm run test:analyze-cancellation

      - name: Installed protected-registry access contract
        run: npm run test:analyze-access

  packed-templates:
    name: Packed template integration (Node LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Setup qualified npm
        shell: bash
        run: |
          npm install --global npm@12.0.1
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "12.0.1"
      - name: Install dependencies
        run: npm ci
      - name: Verify packed CLI against every template
        run: npm run test:templates

  peer-floor:
    name: Packed Askr peer floor (0.4.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Setup qualified npm
        shell: bash
        run: |
          npm install --global npm@12.0.1
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "12.0.1"
      - name: Install dependencies
        run: npm ci
      - name: Verify the minimum supported Askr peer
        run: npm run test:peer-floor

  benchmark:
    name: Performance gate (Ubuntu, Node LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Setup qualified npm
        shell: bash
        run: |
          npm install --global npm@12.0.1
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "12.0.1"
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic CLI performance gate
        run: npm run bench
